# Piano Pad practice-log receiver (server/logsrv.py on 127.0.0.1:8790).
# Home LAN and tailnet only; the app posts here from https://piano.ezyang.com.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logs.cranbury.ezyang.com;

    ssl_certificate /etc/letsencrypt/live/cranbury.ezyang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cranbury.ezyang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    allow 192.168.86.0/24;    # home LAN
    allow 100.64.0.0/10;      # tailnet
    deny all;

    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
    }
}
